<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Handshake Quick Apply</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Handshake Quick Apply</h1>
      <p class="warning">Only submits in-platform applications that require just your selected resume.</p>
      <p id="page-status" role="status">Checking current tab...</p>
      <div id="missing-warning" class="warning" hidden>
        Required selectors are not configured:
        <ul id="missing-list"></ul>
      </div>

      <section class="controls">
        <label>Max potential applies <input id="max-applications" type="number" min="1" max="100" value="25"></label>
        <label>Minimum delay (ms) <input id="min-delay" type="number" min="0" value="1500"></label>
        <label>Maximum delay (ms) <input id="max-delay" type="number" min="0" value="4000"></label>
        <label>Listing mode
          <select id="list-mode">
            <option value="scroll">Infinite scroll</option>
            <option value="paginate" selected>Pagination</option>
          </select>
        </label>
        <label class="live-option">
          <input id="live-submit" type="checkbox">
          Submit eligible applications
        </label>
      </section>

      <div class="buttons">
        <button id="start">Start dry-run</button>
        <button id="pause">Pause</button>
        <button id="resume">Resume</button>
        <button id="stop">Stop</button>
      </div>

      <section>
        <h2>Session summary</h2>
        <p id="summary">Applied: 0 · Skipped: 0 · Errors: 0 · Would apply: 0</p>
      </section>

      <section>
        <h2>Recent log</h2>
        <ol id="log"></ol>
        <button id="export">Export log as CSV</button>
      </section>
    </main>
    <script src="../config/selectors.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
